name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  # The dependency-review action reads the pull request's dependency diff via
  # the pull-request API; without this it fails with HTTP 403 Forbidden.
  pull-requests: read

jobs:
  dependency-review:
    name: Dependency Review — New Vulnerabilities and Licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec
        with:
          config-file: ./.github/dependency-review-config.yml
