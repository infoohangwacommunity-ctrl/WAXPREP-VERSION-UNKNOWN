name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'  # Daily flake detection

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v3
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - run: uv sync --dev
      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short
        env:
          TIMEOUT: 10

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v3
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - run: uv sync --dev
      - name: Run integration tests
        run: uv run --dev pytest tests/integration/ -v --tb=short
        env:
          TIMEOUT: 30

  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v3
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - run: uv sync --dev
      - name: Run contract tests
        run: uv run --dev pytest tests/contract/ -v --tb=short

  lifecycle-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v3
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - run: uv sync --dev
      - name: Run lifecycle tests
        run: uv run --dev pytest tests/lifecycle/ -v --tb=short

  architecture-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v3
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - run: uv sync --dev
      - name: Run architecture tests
        run: uv run --dev pytest tests/architecture/ -v --tb=short

  configuration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v3
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - run: uv sync --dev
      - name: Run configuration tests
        run: uv run --dev pytest tests/configuration/ -v --tb=short

  full-test-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v3
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - run: uv sync --dev
      - name: Run full test suite
        run: uv run --dev pytest tests/ -v --tb=short
        env:
          TIMEOUT: 60

  flake-detection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v3
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - run: uv sync --dev
      - name: Run flake detection (10 consecutive runs)
        run: |
          set -e
          FAILURES=0
          for i in $(seq 1 10); do
            echo "=== Run $i ==="
            if ! uv run --dev pytest tests/unit/ tests/integration/ -v --tb=short; then
              FAILURES=$((FAILURES + 1))
            fi
          done
          echo "Failures: $FAILURES"
          if [ $FAILURES -gt 0 ]; then
            echo "Flake detection FAILED: $FAILURES/10 runs failed"
            exit 1
          fi
          echo "Flake detection PASSED: all 10 runs succeeded"
