name: Test Suite & Static Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'  # Daily flake detection

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Test Suite
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v3
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - run: uv sync --extra dev
      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short
        env:
          TIMEOUT: 10

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v3
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - run: uv sync --extra dev
      - name: Run integration tests
        run: uv run pytest tests/integration/ -v --tb=short
        env:
          TIMEOUT: 30

  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v3
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - run: uv sync --extra dev
      - name: Run contract tests
        run: uv run pytest tests/contract/ -v --tb=short

  lifecycle-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v3
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - run: uv sync --extra dev
      - name: Run lifecycle tests
        run: uv run pytest tests/lifecycle/ -v --tb=short

  architecture-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v3
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - run: uv sync --extra dev
      - name: Run architecture tests
        run: uv run pytest tests/architecture/ -v --tb=short

  configuration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v3
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - run: uv sync --extra dev
      - name: Run configuration tests
        run: uv run pytest tests/configuration/ -v --tb=short

  full-test-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v3
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - run: uv sync --extra dev
      - name: Run full test suite
        run: uv run pytest tests/ -v --tb=short
        env:
          TIMEOUT: 60

  flake-detection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v3
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - run: uv sync --extra dev
      - name: Run flake detection (10 consecutive runs)
        run: |
          set -e
          FAILURES=0
          for i in $(seq 1 10); do
            echo "=== Run $i ==="
            if ! uv run pytest tests/unit/ tests/integration/ -v --tb=short; then
              FAILURES=$((FAILURES + 1))
            fi
          done
          echo "Failures: $FAILURES"
          if [ $FAILURES -gt 0 ]; then
            echo "Flake detection FAILED: $FAILURES/10 runs failed"
            exit 1
          fi
          echo "Flake detection PASSED: all 10 runs succeeded"

  # Static Analysis (Blocking)
  ruff-lint:
    name: Ruff Lint (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v3
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - run: uv sync --extra dev
      - name: Run ruff check
        run: uv run ruff check src/ tests/

  ruff-format:
    name: Ruff Format (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v3
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - run: uv sync --extra dev
      - name: Run ruff format check
        run: uv run ruff format --check src/ tests/

  mypy:
    name: Mypy Type Check (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v3
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - run: uv sync --extra dev
      - name: Run mypy
        run: uv run mypy src/

  pyright:
    name: Pyright Type Check (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v3
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - run: uv sync --extra dev
      - name: Run pyright
        run: uv run pyright src/

  import-linter:
    name: Import Linter (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v3
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - run: uv sync --extra dev
      - name: Run import-linter
        run: uv run importlinter src/waxprep/

  semgrep:
    name: Semgrep Security Scan (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v3
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - run: uv sync --extra dev
      - name: Run semgrep
        run: uv run semgrep --config auto --error src/

  # Static Analysis (Advisory)
  vulture:
    name: Vulture Dead Code Report (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v3
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - run: uv sync --extra dev
      - name: Run vulture
        run: uv run vulture src/waxprep/ --min-confidence 80
