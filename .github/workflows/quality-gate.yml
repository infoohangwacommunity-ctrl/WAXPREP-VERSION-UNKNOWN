name: CI — Quality Gate

# Stage 10: this workflow is the acceptance system, not another quality
# inspector. Each job executes one established quality system (Stages 05–09)
# and records machine-readable evidence. The `ci-acceptance` job decides
# acceptance from that evidence alone: a skipped, cancelled, failed, missing or
# stale-commit result can never be reported as a pass.
# See docs/STAGE_10_CI_SPECIFICATION.md and docs/CI_ACCEPTANCE_POLICY.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer pull-request run supersedes the older one; a main run is never
# cancelled, because its evidence is the record for that commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 0a. CI audit — the acceptance system audits its own definition
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  ci-audit:
    name: CI Audit — Workflow Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: true
          python-version: '3.14'

      - name: Restore uv package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/uv
          key: waxprep-uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            waxprep-uv-${{ runner.os }}-

      - name: Verify dev environment
        run: uv sync --extra dev --frozen

      - name: Audit workflow definitions (pinning, triggers, jobs, matrix, evidence)
        run: uv run python -m waxprep.ci.cli audit

      - name: Record CI evidence
        if: always()
        run: >
          uv run python -m waxprep.ci.cli record
          --job ci-audit --class blocking --status "${{ job.status }}"
          --commit "${{ github.sha }}" --run-id "${{ github.run_id }}-${{ github.run_attempt }}"
          --output ci-evidence

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-evidence-ci-audit
          path: ci-evidence/
          retention-days: 30
          if-no-files-found: error

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 0b. Setup — single uv sync + shared package cache (run once)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  quality-setup:
    name: Prepare environment (single uv sync + shared cache)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: true
          python-version: '3.14'

      - name: Restore uv package cache
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/uv
          key: waxprep-uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            waxprep-uv-${{ runner.os }}-

      - name: Sync dev dependencies (single heavy sync; warms cache)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: uv sync --extra dev

      # The cache is an optimisation only: every job still verifies the locked
      # environment with `uv sync --frozen` before running anything.
      - name: Save uv package cache
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/uv
          key: waxprep-uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Record CI evidence
        if: always()
        run: >
          uv run python -m waxprep.ci.cli record
          --job quality-setup --class blocking --status "${{ job.status }}"
          --commit "${{ github.sha }}" --run-id "${{ github.run_id }}-${{ github.run_attempt }}"
          --output ci-evidence

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-evidence-quality-setup
          path: ci-evidence/
          retention-days: 30
          if-no-files-found: error

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 1. Quality Gate — Stages 06–09 blocking static analysis (fast failure)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  quality-gate:
    name: Quality Gate — Blocking Static Analysis
    needs: [quality-setup]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: true
          python-version: '3.14'

      - name: Restore uv package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/uv
          key: waxprep-uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            waxprep-uv-${{ runner.os }}-

      - name: Verify dev environment (fast no-op when cache warm)
        run: uv sync --extra dev --frozen

      - name: Verify lockfile integrity
        run: uv lock --check

      - name: 'Run unified quality gate (set -e: first failure aborts)'
        run: |
          set -euo pipefail
          echo "==> ruff lint"
          uv run ruff check src/ tests/
          echo "==> ruff format check"
          uv run ruff format --check src/ tests/
          echo "==> mypy (strict)"
          uv run mypy src/
          echo "==> import-linter (architecture contracts)"
          uv run import-linter lint --no-logo
          echo "==> communication contract schemas (Stage 17)"
          uv run python -m waxprep.contracts.cli check --schemas contracts/schemas
          echo "==> semgrep (security + Stage 08 custom rules)"
          # Exclude detector directory - the Python AST detector handles it
          uv run semgrep --config .semgrep --error --exclude src/waxprep/detector src/
          echo "==> dependency and supply-chain security (Stage 09)"
          # Runs pip-audit without a blanket ignore, then applies exceptions that
          # are scoped per advisory/package/version and expire automatically.
          # Also checks lockfile hashes, dependency sources, licenses and OSV
          # malicious-package intelligence for the resolved runtime set.
          uv run python -m waxprep.supplychain.cli check --format summary
          echo "==> Universal Hardcoding Detector (Stage 08)"
          # Explicit default scope (see DEFAULT_SCAN_TARGETS): Python sources,
          # active docs, README, tests/README and pyproject.toml. Not a blind
          # whole-repository scan, so dependency trees are never inspected.
          uv run python -m waxprep.detector.cli --format summary

      - name: Record CI evidence
        if: always()
        run: >
          uv run python -m waxprep.ci.cli record
          --job quality-gate --class blocking --status "${{ job.status }}"
          --commit "${{ github.sha }}" --run-id "${{ github.run_id }}-${{ github.run_attempt }}"
          --output ci-evidence

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-evidence-quality-gate
          path: ci-evidence/
          retention-days: 30
          if-no-files-found: error

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 2. Tests — every declared category in parallel (matrix)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  tests:
    name: Tests — ${{ matrix.category }}
    needs: [quality-setup]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        category: [unit, integration, contract, lifecycle, architecture, configuration, regression]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: true
          python-version: '3.14'

      - name: Restore uv package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/uv
          key: waxprep-uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            waxprep-uv-${{ runner.os }}-

      - name: Verify dev environment
        run: uv sync --extra dev --frozen

      - name: Run ${{ matrix.category }} tests
        # Directory already scopes the category. Keep -m for categories that declare
        # markers (unit/integration/…). Configuration also declares
        # pytestmark = configuration so the matrix filter stays consistent.
        run: uv run pytest tests/${{ matrix.category }} -m ${{ matrix.category }} --tb=short -o addopts=""

      - name: Record CI evidence
        if: always()
        run: >
          uv run python -m waxprep.ci.cli record
          --job "tests-${{ matrix.category }}" --class blocking --status "${{ job.status }}"
          --commit "${{ github.sha }}" --run-id "${{ github.run_id }}-${{ github.run_attempt }}"
          --output ci-evidence

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-evidence-tests-${{ matrix.category }}
          path: ci-evidence/
          retention-days: 30
          if-no-files-found: error

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 3. Coverage gate — full suite, 100% threshold (never lower)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  coverage-gate:
    name: Coverage Gate — Full Suite (100%)
    needs: [quality-setup]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: true
          python-version: '3.14'

      - name: Restore uv package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/uv
          key: waxprep-uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            waxprep-uv-${{ runner.os }}-

      - name: Verify dev environment
        run: uv sync --extra dev --frozen

      - name: Run full suite with coverage
        run: |
          uv run pytest tests/ \
            --cov=waxprep \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=100 \
            --tb=short

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

      - name: Record CI evidence
        if: always()
        run: >
          uv run python -m waxprep.ci.cli record
          --job coverage-gate --class blocking --status "${{ job.status }}"
          --commit "${{ github.sha }}" --run-id "${{ github.run_id }}-${{ github.run_attempt }}"
          --output ci-evidence

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-evidence-coverage-gate
          path: ci-evidence/
          retention-days: 30
          if-no-files-found: error

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 4. Smoke test — app boot + healthcheck (blocking)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  smoke-test:
    name: Smoke Test — App Boot + Healthcheck
    needs: [quality-setup]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: true
          python-version: '3.14'

      - name: Restore uv package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/uv
          key: waxprep-uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            waxprep-uv-${{ runner.os }}-

      - name: Verify dev environment
        run: uv sync --extra dev --frozen

      - name: Start app and run healthcheck smoke test
        run: |
          uv run uvicorn waxprep.main:get_app --host 127.0.0.1 --port 8001 &
          SERVER_PID=$!
          # Poll for readiness instead of relying on a fixed sleep.
          READY=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8001/health/liveness >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            kill "$SERVER_PID" 2>/dev/null || true
            echo "Liveness check failed: app did not become ready within 30 seconds"
            exit 1
          fi
          curl -sf http://127.0.0.1:8001/health/readiness || { kill "$SERVER_PID" 2>/dev/null; echo "Readiness check failed"; exit 1; }
          kill "$SERVER_PID" 2>/dev/null
          echo "Smoke test PASSED: app boots and both health endpoints respond"

      - name: Record CI evidence
        if: always()
        run: >
          uv run python -m waxprep.ci.cli record
          --job smoke-test --class blocking --status "${{ job.status }}"
          --commit "${{ github.sha }}" --run-id "${{ github.run_id }}-${{ github.run_attempt }}"
          --output ci-evidence

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-evidence-smoke-test
          path: ci-evidence/
          retention-days: 30
          if-no-files-found: error

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 5. Supply-chain evidence — SBOM + trust report required by acceptance
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  supply-chain-evidence:
    name: Supply-Chain Evidence — SBOM + Trust Report
    needs: [quality-setup]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: true
          python-version: '3.14'

      - name: Restore uv package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/uv
          key: waxprep-uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            waxprep-uv-${{ runner.os }}-

      - name: Verify dev environment
        run: uv sync --extra dev --frozen

      - name: Verify lockfile integrity
        run: uv lock --check

      - name: Generate CycloneDX SBOM (required evidence)
        run: uv run python -m waxprep.supplychain.cli sbom --output artifacts/waxprep-sbom.cdx.json

      - name: Generate Dependency Trust Intelligence report (advisory)
        continue-on-error: true
        run: >-
          uv run python -m waxprep.supplychain.cli trust
          --output artifacts/dependency-trust.md

      - name: Record CI evidence
        if: always()
        run: >
          uv run python -m waxprep.ci.cli record
          --job supply-chain-evidence --class blocking --status "${{ job.status }}"
          --commit "${{ github.sha }}" --run-id "${{ github.run_id }}-${{ github.run_attempt }}"
          --output ci-evidence

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-evidence-supply-chain-evidence
          path: ci-evidence/
          retention-days: 30
          if-no-files-found: error

      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: supply-chain-evidence
          path: artifacts/
          retention-days: 90
          if-no-files-found: error

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 6a. Pyright — advisory (reported, never blocks acceptance)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  pyright:
    name: Pyright — Advisory Type Check
    needs: [quality-setup]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: true
          python-version: '3.14'

      - name: Restore uv package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/uv
          key: waxprep-uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            waxprep-uv-${{ runner.os }}-

      - name: Verify dev environment
        run: uv sync --extra dev --frozen

      - name: Run pyright (advisory — recorded, does not block)
        id: pyright
        continue-on-error: true
        run: uv run pyright src/

      - name: Record CI evidence
        if: always()
        run: >
          uv run python -m waxprep.ci.cli record
          --job pyright --class advisory --phase "${{ steps.pyright.outcome == '' && 'setup' || 'check' }}"
          --status "${{ steps.pyright.outcome || job.status }}"
          --commit "${{ github.sha }}" --run-id "${{ github.run_id }}-${{ github.run_attempt }}"
          --output ci-evidence

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-evidence-pyright
          path: ci-evidence/
          retention-days: 30
          if-no-files-found: error

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 6b. Vulture — advisory dead code report (reported, never blocks acceptance)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  vulture:
    name: Vulture — Advisory Dead Code Report
    needs: [quality-setup]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: true
          python-version: '3.14'

      - name: Restore uv package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/uv
          key: waxprep-uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            waxprep-uv-${{ runner.os }}-

      - name: Verify dev environment
        run: uv sync --extra dev --frozen

      - name: Run vulture (advisory — recorded, does not block)
        id: vulture
        continue-on-error: true
        run: uv run vulture src/waxprep/

      - name: Record CI evidence
        if: always()
        run: >
          uv run python -m waxprep.ci.cli record
          --job vulture --class advisory --phase "${{ steps.vulture.outcome == '' && 'setup' || 'check' }}"
          --status "${{ steps.vulture.outcome || job.status }}"
          --commit "${{ github.sha }}" --run-id "${{ github.run_id }}-${{ github.run_attempt }}"
          --output ci-evidence

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-evidence-vulture
          path: ci-evidence/
          retention-days: 30
          if-no-files-found: error

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 7. Acceptance — the only job allowed to declare a commit accepted
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  ci-acceptance:
    name: CI Acceptance — Independent Evidence Verification
    needs:
      - ci-audit
      - quality-setup
      - quality-gate
      - tests
      - coverage-gate
      - smoke-test
      - supply-chain-evidence
      - pyright
      - vulture
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: true
          python-version: '3.14'

      - name: Restore uv package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/uv
          key: waxprep-uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            waxprep-uv-${{ runner.os }}-

      - name: Verify dev environment
        run: uv sync --extra dev --frozen

      - name: Bind evidence to the assessed commit
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}" || {
            echo "Checked-out HEAD does not match the assessed commit ${{ github.sha }}"
            exit 1
          }

      # Downloads continue on error so that a missing artifact becomes an
      # explicit rejection with a reason, never a silent pass.
      - name: Download job evidence
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          pattern: ci-evidence-*
          path: evidence
          merge-multiple: true

      - name: Download coverage report
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: coverage-report
          path: reports

      - name: Download supply-chain evidence
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: supply-chain-evidence
          path: reports/supply-chain

      - name: Decide acceptance from recorded evidence
        run: |
          uv run python -m waxprep.ci.cli accept \
            --evidence-dir evidence \
            --commit "${{ github.sha }}" \
            --coverage reports/coverage.xml \
            --sbom reports/supply-chain/waxprep-sbom.cdx.json \
            --report ci-acceptance/acceptance.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload acceptance decision
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-acceptance-${{ github.sha }}
          path: ci-acceptance/
          retention-days: 90
          if-no-files-found: error
