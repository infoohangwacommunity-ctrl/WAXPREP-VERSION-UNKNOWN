name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-setup:
    name: Prepare environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up uv
        uses: astral-sh/setup-uv@aeb46491c743cadc4cba26bb752a065b9c7593be
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Install dependencies
        run: uv sync --extra dev

  quality-gate:
    name: Quality Gate — Blocking Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality-setup]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up uv
        uses: astral-sh/setup-uv@aeb46491c743cadc4cba26bb752a065b9c7593be
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Ruff lint
        run: uv run ruff check src/ tests/
      - name: Ruff format check
        run: uv run ruff format --check src/ tests/
      - name: Mypy (strict)
        run: uv run mypy src/
      - name: Import lintinter
        run: uv run import-linter lint --no-logo
      - name: Semgrep security
        run: uv run semgrep --config auto --error src/
      - name: Pip audit
        run: uv run pip-audit

  tests:
    name: Tests — ${{ matrix.category }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        category: [unit, integration, contract, lifecycle, architecture, configuration]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up uv
        uses: astral-sh/setup-uv@aeb46491c743cadc4cba26bb752a065b9c7593be
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run ${{ matrix.category }} tests
        run: uv run pytest tests/${{ matrix.category }} -m ${{ matrix.category }} --tb=short -o addopts=""

  coverage-gate:
    name: Coverage Gate — Full Suite (100%)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality-setup]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up uv
        uses: astral-sh/setup-uv@aeb46491c743cadc4cba26bb752a065b9c7593be
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run full suite with coverage
        run: |
          uv run pytest tests/ \\
            --cov=waxprep \\
            --cov-report=xml \\
            --cov-report=term-missing \\
            --cov-fail-under=100 \\
            --tb=short
      - name: Upload coverage report
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  smoke-test:
    name: Smoke Test — App Boot + Healthcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [quality-setup]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up uv
        uses: astral-sh/setup-uv@aeb46491c743cadc4cba26bb752a065b9c7593be
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Start app and run healthcheck smoke test
        run: |
          uv run uvicorn waxprep.main:get_app --host 127.0.0.1 --port 8001 &
          SERVER_PID=$!
          sleep 3
          curl -sf http://127.0.0.1:8001/health/liveness || { kill $SERVER_PID 2>/dev/null; echo "Liveness check failed"; exit 1; }
          curl -sf http://127.0.0.1:8001/health/readiness || { kill $SERVER_PID 2>/dev/null; echo "Readiness check failed"; exit 1; }
          kill $SERVER_PID 2>/dev/null
          echo "Smoke test PASSED: app boots and both health endpoints respond"

  pyright:
    name: Pyright — Advisory Type Check
    needs: [quality-setup]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up uv
        uses: astral-sh/setup-uv@aeb46491c743cadc4cba26bb752a065b9c7593be
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run pyright (advisory — does not block)
        run: uv run pyright src/ || true

  vulture:
    name: Vulture — Advisory Dead Code Report
    needs: [quality-setup]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up uv
        uses: astral-sh/setup-uv@aeb46491c743cadc4cba26bb752a065b9c7593be
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run vulture (advisory — does not block)
        run: uv run vulture src/waxprep/ || true

  gate-aggregate:
    name: Gate Aggregate — Overall Status
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report overall gate status
        run: |
          echo "## Quality Gate Report" >> ${{ github.step_summary }}
          echo "" >> ${{ github.step_summary }}
          echo "| Job | Status |" >> ${{ github.step_summary }}
          echo "|-----|--------|" >> ${{ github.step_summary }}
          
          # Check quality-setup
          if [ "${{ needs.quality-setup.result }}" = "success" ]; then
            echo "| quality-setup | PASSED |" >> ${{ github.step_summary }}
          elif [ "${{ needs.quality-setup.result }}" = "failure" ]; then
            echo "| quality-setup | FAILED |" >> ${{ github.step_summary }}
          elif [ "${{ needs.quality-setup.result }}" = "cancelled" ]; then
            echo "| quality-setup | CANCELLED |" >> ${{ github.step_summary }}
          else
            echo "| quality-setup | SKIPPED |" >> ${{ github.step_summary }}
          fi
          
          # Check quality-gate
          if [ "${{ needs.quality-gate.result }}" = "success" ]; then
            echo "| quality-gate | PASSED |" >> ${{ github.step_summary }}
          elif [ "${{ needs.quality-gate.result }}" = "failure" ]; then
            echo "| quality-gate | FAILED |" >> ${{ github.step_summary }}
          elif [ "${{ needs.quality-gate.result }}" = "cancelled" ]; then
            echo "| quality-gate | CANCELLED |" >> ${{ github.step_summary }}
          else
            echo "| quality-gate | SKIPPED |" >> ${{ github.step_summary }}
          fi
          
          # Check tests
          if [ "${{ needs.tests.result }}" = "success" ]; then
            echo "| tests | PASSED |" >> ${{ github.step_summary }}
          elif [ "${{ needs.tests.result }}" = "failure" ]; then
            echo "| tests | FAILED |" >> ${{ github.step_summary }}
          elif [ "${{ needs.tests.result }}" = "cancelled" ]; then
            echo "| tests | CANCELLED |" >> ${{ github.step_summary }}
          else
            echo "| tests | SKIPPED |" >> ${{ github.step_summary }}
          fi
          
          # Check coverage-gate
          if [ "${{ needs.coverage-gate.result }}" = "success" ]; then
            echo "| coverage-gate | PASSED |" >> ${{ github.step_summary }}
          elif [ "${{ needs.coverage-gate.result }}" = "failure" ]; then
            echo "| coverage-gate | FAILED |" >> ${{ github.step_summary }}
          elif [ "${{ needs.coverage-gate.result }}" = "cancelled" ]; then
            echo "| coverage-gate | CANCELLED |" >> ${{ github.step_summary }}
          else
            echo "| coverage-gate | SKIPPED |" >> ${{ github.step_summary }}
          fi
          
          # Check smoke-test
          if [ "${{ needs.smoke-test.result }}" = "success" ]; then
            echo "| smoke-test | PASSED |" >> ${{ github.step_summary }}
          elif [ "${{ needs.smoke-test.result }}" = "failure" ]; then
            echo "| smoke-test | FAILED |" >> ${{ github.step_summary }}
          elif [ "${{ needs.smoke-test.result }}" = "cancelled" ]; then
            echo "| smoke-test | CANCELLED |" >> ${{ github.step_summary }}
          else
            echo "| smoke-test | SKIPPED |" >> ${{ github.step_summary }}
          fi
          
          echo "" >> ${{ github.step_summary }}
          echo "### Gate Result" >> ${{ github.step_summary }}
          
          # Determine final result
          FAILURES=0
          if [ "${{ needs.quality-setup.result }}" = "failure" ] || [ "${{ needs.quality-setup.result }}" = "cancelled" ]; then
            FAILURES=$((FAILURES+1))
          fi
          if [ "${{ needs.quality-gate.result }}" = "failure" ] || [ "${{ needs.quality-gate.result }}" = "cancelled" ]; then
            FAILURES=$((FAILURES+1))
          fi
          if [ "${{ needs.tests.result }}" = "failure" ] || [ "${{ needs.tests.result }}" = "cancelled" ]; then
            FAILURES=$((FAILURES+1))
          fi
          if [ "${{ needs.coverage-gate.result }}" = "failure" ] || [ "${{ needs.coverage-gate.result }}" = "cancelled" ]; then
            FAILURES=$((FAILURES+1))
          fi
          if [ "${{ needs.smoke-test.result }}" = "failure" ] || [ "${{ needs.smoke-test.result }}" = "cancelled" ]; then
            FAILURES=$((FAILURES+1))
          fi
          
          if [ $FAILURES -gt 0 ]; then
            echo "One or more blocking jobs failed or were cancelled. Gate FAILED." >> ${{ github.step_summary }}
            exit 1
          else
            echo "All blocking jobs passed. Gate PASSED." >> ${{ github.step_summary }}
          fi

  pyright:
    name: Pyright — Advisory Type Check
    needs: [quality-setup]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up uv
        uses: astral-sh/setup-uv@aeb46491c743cadc4cba26bb752a065b9c7593be
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run pyright (advisory — does not block)
        run: uv run pyright src/ || true

  vulture:
    name: Vulture — Advisory Dead Code Report
    needs: [quality-setup]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up uv
        uses: astral-sh/setup-uv@aeb46491c743cadc4cba26bb752a065b9c7593be
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run vulture (advisory — does not block)
        run: uv run vulture src/waxprep/ || true
