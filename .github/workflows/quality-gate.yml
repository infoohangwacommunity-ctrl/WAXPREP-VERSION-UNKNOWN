name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 0. Setup — single uv sync + shared package cache (run once)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  quality-setup:
    name: Prepare environment (single uv sync + shared cache)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv (uv manages Python 3.14)
        uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Restore uv package cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: waxprep-uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            waxprep-uv-${{ runner.os }}-

      - name: Sync dev dependencies (single heavy sync; warms cache)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: uv sync --extra dev

      - name: Save uv package cache
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/uv
          key: waxprep-uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 1. Quality Gate — unified blocking static analysis (fast failure)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  quality-gate:
    name: Quality Gate — Blocking Static Analysis
    needs: [quality-setup]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Restore uv package cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: waxprep-uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            waxprep-uv-${{ runner.os }}-

      - name: Verify dev environment (fast no-op when cache warm)
        run: uv sync --extra dev --frozen

      - name: Run unified quality gate (set -e: first failure aborts)
        run: |
          set -euo pipefail
          echo "==> ruff lint"
          uv run ruff check src/ tests/
          echo "==> ruff format check"
          uv run ruff format --check src/ tests/
          echo "==> mypy (strict)"
          uv run mypy src/
          echo "==> pyright (strict)"
          uv run pyright src/
          echo "==> import-linter (architecture contracts)"
          uv run import-linter lint --no-logo
          echo "==> semgrep (security)"
          uv run semgrep --config auto --error src/
          echo "==> vulture (dead code — advisory, does not block)"
          uv run vulture src/waxprep/ || true

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 2. Tests — all categories in parallel (matrix)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  tests:
    name: Tests — ${{ matrix.category }}
    needs: [quality-setup]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        category: [unit, integration, contract, lifecycle, architecture, configuration, regression]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Restore uv package cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: waxprep-uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            waxprep-uv-${{ runner.os }}-

      - name: Verify dev environment
        run: uv sync --extra dev --frozen

      - name: Run ${{ matrix.category }} tests
        run: uv run pytest tests/${{ matrix.category }} -v -m ${{ matrix.category }} --tb=short

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 3. Coverage gate — full suite, 90% threshold
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  coverage-gate:
    name: Coverage Gate — Full Suite (90%)
    needs: [quality-setup]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Restore uv package cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: waxprep-uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            waxprep-uv-${{ runner.os }}-

      - name: Verify dev environment
        run: uv sync --extra dev --frozen

      - name: Run full suite with coverage
        run: |
          uv run pytest tests/ \
            --cov=waxprep \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            --tb=short

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 4. Flake detection — push to main AND schedule (not schedule-only)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  flake-detection:
    name: Flake Detection — Push to Main
    needs: [quality-setup]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Restore uv package cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: waxprep-uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            waxprep-uv-${{ runner.os }}-

      - name: Verify dev environment
        run: uv sync --extra dev --frozen

      - name: Run flake detection (10 consecutive runs)
        run: |
          set -e
          FAILURES=0
          for i in $(seq 1 10); do
            echo "=== Flake run $i ==="
            if ! uv run pytest tests/unit tests/integration -v --tb=short -q; then
              FAILURES=$((FAILURES + 1))
            fi
          done
          echo "Flake failures: $FAILURES / 10"
          if [ "$FAILURES" -gt 0 ]; then
            echo "FLAKE DETECTION FAILED: $FAILURES/10 runs failed"
            exit 1
          fi
          echo "Flake detection PASSED: all 10 runs succeeded"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 5. Gate aggregate — overall status (final gate decision)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  gate-aggregate:
    name: Gate Aggregate — Overall Status
    needs: [quality-setup, quality-gate, tests, coverage-gate, flake-detection]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report overall gate status
        run: |
          echo "## Quality Gate Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| quality-setup | ${{ needs.quality-setup.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| quality-gate | ${{ needs.quality-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| tests | ${{ needs.tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| coverage-gate | ${{ needs.coverage-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| flake-detection | ${{ needs.flake-detection.result }} |" >> $GITHUB_STEP_SUMMARY
      - name: Fail gate if any blocking job failed or was cancelled
        if: >
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more blocking jobs failed or were cancelled. Gate FAILED."
          exit 1
      - name: Gate passed
        if: success()
        run: echo "All blocking jobs passed. Gate PASSED."