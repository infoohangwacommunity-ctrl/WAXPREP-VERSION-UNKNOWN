name: Quality Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality-setup:
    name: Prepare environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up uv
        uses: astral-sh/setup-uv@aeb46491c743cadc4cba26bb752a065b9c7593be
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Install dependencies
        run: uv sync --extra dev
  quality-gate:
    name: Quality Gate — Blocking Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality-setup]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up uv
        uses: astral-sh/setup-uv@aeb46491c743cadc4cba26bb752a065b9c7593be
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Ruff lint
        run: uv run ruff check src/ tests/
      - name: Ruff format check
        run: uv run ruff format --check src/ tests/
      - name: Mypy (strict)
        run: uv run mypy src/
      - name: Import lintinter
        run: uv run import-linter lint --no-logo
      - name: Semgrep security
        run: uv run semgrep --config auto --error src/
      - name: Pip audit
        run: uv run pip-audit
  tests:
    name: Tests — ${{ matrix.category }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        category: [unit, integration, contract, lifecycle, architecture, configuration]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up uv
        uses: astral-sh/setup-uv@aeb46491c743cadc4cba26bb752a065b9c7593be
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run ${{ matrix.category }} tests
        run: uv run pytest tests/${{ matrix.category }} -m ${{ matrix.category }} --tb=short -o addopts=""
  coverage-gate:
    name: Coverage Gate — Full Suite (100%)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality-setup]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up uv
        uses: astral-sh/setup-uv@aeb46491c743cadc4cba26bb752a065b9c7593be
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run full suite with coverage
        run: |
          uv run pytest tests/ \
            --cov=waxprep \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=100 \
            --tb=short
      - name: Upload coverage report
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30
  smoke-test:
    name: Smoke Test — App Boot + Healt