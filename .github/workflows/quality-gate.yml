name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 0. Setup — single uv sync + shared package cache (run once)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  quality-setup:
    name: Prepare environment (single uv sync + shared cache)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: true
          python-version: '3.14'

      - name: Restore uv package cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: waxprep-uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            waxprep-uv-${{ runner.os }}-

      - name: Sync dev dependencies (single heavy sync; warms cache)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: uv sync --extra dev

      - name: Save uv package cache
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/uv
          key: waxprep-uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 1. Quality Gate — unified blocking static analysis (fast failure)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  quality-gate:
    name: Quality Gate — Blocking Static Analysis
    needs: [quality-setup]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: true
          python-version: '3.14'

      - name: Restore uv package cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: waxprep-uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            waxprep-uv-${{ runner.os }}-

      - name: Verify dev environment (fast no-op when cache warm)
        run: uv sync --extra dev --frozen

      - name: Verify lockfile integrity
        run: uv lock --check

      - name: 'Run unified quality gate (set -e: first failure aborts)'
        run: |
          set -euo pipefail
          echo "==> ruff lint"
          uv run ruff check src/ tests/
          echo "==> ruff format check"
          uv run ruff format --check src/ tests/
          echo "==> mypy (strict)"
          uv run mypy src/
          echo "==> import-linter (architecture contracts)"
          uv run import-linter lint --no-logo
          echo "==> semgrep (security + Stage 08 custom rules)"
          # Exclude detector directory - the Python AST detector handles it
          uv run semgrep --config .semgrep --error --exclude src/waxprep/detector src/
          echo "==> dependency and supply-chain security (Stage 09)"
          # Runs pip-audit without a blanket ignore, then applies exceptions that
          # are scoped per advisory/package/version and expire automatically.
          # Also checks lockfile hashes, dependency sources, licenses and OSV
          # malicious-package intelligence for the resolved runtime set.
          uv run python -m waxprep.supplychain.cli check --format summary
          echo "==> Universal Hardcoding Detector (Stage 08)"
          # Explicit default scope (see DEFAULT_SCAN_TARGETS): Python sources,
          # active docs, README, tests/README and pyproject.toml. Not a blind
          # whole-repository scan, so dependency trees are never inspected.
          uv run python -m waxprep.detector.cli --format summary

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 2. Tests — all categories in parallel (matrix)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  tests:
    name: Tests — ${{ matrix.category }}
    needs: [quality-setup]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        category: [unit, integration, contract, lifecycle, architecture, configuration]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: true
          python-version: '3.14'

      - name: Restore uv package cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: waxprep-uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            waxprep-uv-${{ runner.os }}-

      - name: Verify dev environment
        run: uv sync --extra dev --frozen

      - name: Run ${{ matrix.category }} tests
        run: uv run pytest tests/${{ matrix.category }} -m ${{ matrix.category }} --tb=short -o addopts=""

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 3. Coverage gate — full suite, 100% threshold (never lower)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  coverage-gate:
    name: Coverage Gate — Full Suite (100%)
    needs: [quality-setup]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: true
          python-version: '3.14'

      - name: Restore uv package cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: waxprep-uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            waxprep-uv-${{ runner.os }}-

      - name: Verify dev environment
        run: uv sync --extra dev --frozen

      - name: Run full suite with coverage
        run: |
          uv run pytest tests/ \
            --cov=waxprep \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=100 \
            --tb=short

      - name: Upload coverage report
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 4. Smoke test — app boot + healthcheck (blocking)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  smoke-test:
    name: Smoke Test — App Boot + Healthcheck
    needs: [quality-setup]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: true
          python-version: '3.14'

      - name: Restore uv package cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: waxprep-uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            waxprep-uv-${{ runner.os }}-

      - name: Verify dev environment
        run: uv sync --extra dev --frozen

      - name: Start app and run healthcheck smoke test
        run: |
          uv run uvicorn waxprep.main:get_app --host 127.0.0.1 --port 8001 &
          SERVER_PID=$!
          # Poll for readiness instead of relying on a fixed sleep.
          READY=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8001/health/liveness >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            kill "$SERVER_PID" 2>/dev/null || true
            echo "Liveness check failed: app did not become ready within 30 seconds"
            exit 1
          fi
          curl -sf http://127.0.0.1:8001/health/readiness || { kill "$SERVER_PID" 2>/dev/null; echo "Readiness check failed"; exit 1; }
          kill "$SERVER_PID" 2>/dev/null
          echo "Smoke test PASSED: app boots and both health endpoints respond"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 5a. Pyright — advisory (does not fail the gate)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  pyright:
    name: Pyright — Advisory Type Check
    needs: [quality-setup]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: true
          python-version: '3.14'

      - name: Restore uv package cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: waxprep-uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            waxprep-uv-${{ runner.os }}-

      - name: Verify dev environment
        run: uv sync --extra dev --frozen

      - name: Run pyright (advisory — does not block)
        run: uv run pyright src/ || true

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 5b. Vulture — advisory dead code report (does not fail the gate)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  vulture:
    name: Vulture — Advisory Dead Code Report
    needs: [quality-setup]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          enable-cache: true
          python-version: '3.14'

      - name: Restore uv package cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/uv
          key: waxprep-uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            waxprep-uv-${{ runner.os }}-

      - name: Verify dev environment
        run: uv sync --extra dev --frozen

      - name: Run vulture (advisory — does not block)
        run: uv run vulture src/waxprep/ || true

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 6. Gate aggregate — overall status (final gate decision, blocking only)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  gate-aggregate:
    name: Gate Aggregate — Overall Status
    needs: [quality-setup, quality-gate, tests, coverage-gate, smoke-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report overall gate status
        run: |
          echo "## Quality Gate Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| quality-setup | ${{ needs.quality-setup.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| quality-gate | ${{ needs.quality-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| tests | ${{ needs.tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| coverage-gate | ${{ needs.coverage-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| smoke-test | ${{ needs.smoke-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Advisory (non-blocking)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The following jobs run independently of the aggregate and do not block the gate:" >> $GITHUB_STEP_SUMMARY
          echo "- pyright (advisory type check)" >> $GITHUB_STEP_SUMMARY
          echo "- vulture (advisory dead code report)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Their results are reported in their own job summaries, not here, so an advisory" >> $GITHUB_STEP_SUMMARY
          echo "failure can never be mistaken for a blocking gate failure." >> $GITHUB_STEP_SUMMARY
      - name: Fail gate if any blocking job failed or was cancelled
        if: >
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more blocking jobs failed or were cancelled. Gate FAILED."
          exit 1
      - name: Gate passed
        if: success()
        run: echo "All blocking jobs passed. Gate PASSED."
