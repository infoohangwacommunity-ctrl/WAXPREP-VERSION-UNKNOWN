# Dependency Review configuration — Stage 09.
#
# This action evaluates only what a pull request changes. `allow_licenses` must
# match the `approved` list in security/dependency-policy/license-policy.toml
# exactly; the blocking supply-chain gate fails when they disagree. A
# review-required licence such as MPL-2.0 must never appear here: it would be
# approved silently in pull requests instead of reaching a human.
# `deny-licenses` is deprecated by the action; this config uses `allow_licenses`.
fail_on_severity: high
fail_on_scopes:
  - runtime
  - development
allow_licenses:
  - MIT
  - MIT-0
  - BSD-2-Clause
  - BSD-3-Clause
  - Apache-2.0
  - ISC
  - PSF-2.0
