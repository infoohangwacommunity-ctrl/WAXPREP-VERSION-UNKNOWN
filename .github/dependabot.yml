version: 2
# Dependabot proposes updates; it never approves or merges them.
# Every pull request it opens must pass the full Quality Gate and the
# Dependency Review workflow. Major updates stay ungrouped so they get
# individual compatibility review.
updates:
  # WaxPrep resolves dependencies with uv and commits uv.lock, so Dependabot
  # must use the uv ecosystem to update the lockfile (and matching pyproject
  # constraints) correctly. The pip ecosystem does not understand uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps"
    groups:
      python-patch-and-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    groups:
      actions-patch-and-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
