# Semgrep configuration for Universal Hardcoding Detection
#
# This configuration includes all rules for the Stage 08 detector.
# These rules complement the AST-based Python detector with additional
# structural pattern matching capabilities.

rules:
  # WHD-001: Fixed-string comparisons against input
  - id: whd-001-fixed-string-comparison
    patterns:
      - pattern-inside: |
          def $FUNC(...):
            ...
            if $LEFT == $RIGHT:
              ...
            ...
      - pattern-either:
          - pattern: |
              if $INPUT == "$STR":
                ...
    message: |
      Fixed-string comparison against input detected.
      This may indicate hardcoded conversational behavior.
    severity: ERROR
    languages: [python]
    metadata:
      category: correctness
      technology: [python]
      subcategory: audit
      whd_rule: WHD-001
      confidence: HIGH

  # WHD-002: Membership tests against fixed vocabularies
  - id: whd-002-membership-test
    patterns:
      - pattern-inside: |
          def $FUNC(...):
            ...
            if $INPUT in $COLLECTION:
              ...
            ...
      - pattern-either:
          - pattern: |
              if $INPUT in ["$STR1", "$STR2", ...]:
                ...
    message: |
      Membership test against fixed vocabulary detected.
      Consider whether this vocabulary should be dynamic.
    severity: ERROR
    languages: [python]
    metadata:
      category: correctness
      technology: [python]
      subcategory: audit
      whd_rule: WHD-002
      confidence: HIGH

  # WHD-003: If/elif chains with string comparisons
  - id: whd-003-if-elif-chain
    patterns:
      - pattern-inside: |
          def $FUNC(...):
            ...
            if $COND1:
              ...
            elif $COND2:
              ...
            elif $COND3:
              ...
            ...
      - pattern-either:
          - pattern: |
              if $INPUT == "$STR1":
                ...
              elif $INPUT == "$STR2":
                ...
              elif $INPUT == "$STR3":
                ...
    message: |
      Fixed decision tree (if/elif chain) detected with multiple string comparisons.
      This pattern may indicate hardcoded conversational routing.
    severity: WARNING
    languages: [python]
    metadata:
      category: correctness
      technology: [python]
      subcategory: audit
      whd_rule: WHD-003
      confidence: MEDIUM

  # WHD-004: Regex pattern matching with word boundaries
  - id: whd-004-regex-pattern
    patterns:
      - pattern-inside: |
          import re
          ...
          def $FUNC(...):
            ...
            $RESULT = re.$METHOD("$PATTERN", ...)
            ...
      - pattern-either:
          - pattern: |
              re.search(r"\b$WORD\b", ...)
          - pattern: |
              re.match(r"\b$WORD\b", ...)
    message: |
      Regex pattern with word boundaries detected.
      Review whether this pattern is necessary for conversational routing.
    severity: WARNING
    languages: [python]
    metadata:
      category: correctness
      technology: [python]
      subcategory: audit
      whd_rule: WHD-004
      confidence: MEDIUM

  # WHD-005: Dictionary lookups with string keys in mapping-like variables
  - id: whd-005-dict-lookup
    patterns:
      - pattern-inside: |
          def $FUNC(...):
            ...
            $RESULT = $DICT["$KEY"]
            ...
            ...
      - pattern-either:
          - pattern: |
              $RESULT = $MAPPING["$KEY"]
    message: |
      Dictionary lookup with string key in mapping-like variable.
      This may represent a word-to-action mapping.
    severity: WARNING
    languages: [python]
    metadata:
      category: correctness
      technology: [python]
      subcategory: audit
      whd_rule: WHD-005
      confidence: MEDIUM

  # WHD-007: Functions returning literal responses
  - id: whd-007-literal-response
    patterns:
      - pattern-either:
          - pattern: |
              def $RESPONSE_FUNC(...):
                ...
                return "$RESPONSE"
      - pattern-not: |
          def $FUNC(text: str) -> str:
            ...
            return $RESULT
    message: |
      Function with response-indicating name returns a literal string.
    severity: WARNING
    languages: [python]
    metadata:
      category: correctness
      technology: [python]
      subcategory: audit
      whd_rule: WHD-007
      confidence: MEDIUM

  # WHD-008: Hardcoded vocabularies
  - id: whd-008-vocabulary-assignment
    patterns:
      - pattern-either:
          # Only flag variables that look like vocabularies (lowercase or descriptive names)
          # Exclude __all__ which is a module export list, not a vocabulary
          - pattern: |
              $VOCAB = ["$WORD1", "$WORD2", ...]
      # Exclude __all__ assignments
      - pattern-not: |
          __all__ = ...
    message: |
      Hardcoded vocabulary assignment detected.
      Review whether this collection is used for student classification.
    severity: WARNING
    languages: [python]
    metadata:
      category: correctness
      technology: [python]
      subcategory: audit
      whd_rule: WHD-008
      confidence: MEDIUM

  # ── Stage 16: lifecycle ownership ──────────────────────────────────────────
  # Long-running tasks must be owned by BackgroundTaskSupervisor so shutdown
  # can cancel, await and report them. The supervisor is the single allowed
  # creator (see tests/lifecycle/test_lifecycle_static.py for the AST check).
  - id: waxprep-unmanaged-asyncio-task
    patterns:
      - pattern-either:
          - pattern: asyncio.create_task(...)
          - pattern: asyncio.ensure_future(...)
    paths:
      exclude:
        - src/waxprep/lifecycle/background.py
    message: |
      Unmanaged asyncio task creation detected. Start the coroutine through
      BackgroundTaskSupervisor.start() so it has an owner, a termination path
      and a recorded outcome.
    severity: ERROR
    languages: [python]
    metadata:
      category: correctness
      technology: [python]
      subcategory: lifecycle
      confidence: HIGH
