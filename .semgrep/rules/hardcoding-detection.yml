# Semgrep rules for Universal Hardcoding Detection (Stage 08)
#
# These rules complement the AST-based detector with additional
# structural pattern matching capabilities.
#
# Run with: semgrep --config .semgrep --error

rules:
  # =========================================================================
  # WHD-001: Fixed-string comparisons against input
  # =========================================================================
  - id: whd-001-fixed-string-comparison
    patterns:
      - pattern-inside: |
          def $FUNC(...):
            ...
            if $LEFT == $RIGHT:
              ...
    pattern-either:
      - pattern: |
          if $INPUT == "$STR":
            ...
        metavariable-regex:
          metavariable: $INPUT
          regex: "(message|text|content|input|student_message|user_message|query|prompt|body|data|payload)"
      - pattern: |
          if "$STR" == $INPUT:
            ...
        metavariable-regex:
          metavariable: $INPUT
          regex: "(message|text|content|input|student_message|user_message|query|prompt|body|data|payload)"
    message: |
      Fixed-string comparison against input detected.
      This may indicate hardcoded conversational behavior.
      Review whether this comparison is necessary or should be handled by the intelligence layer.
    severity: ERROR
    languages: [python]
    metadata:
      category: correctness
      technology: [python]
      subcategory: audit
      whd_rule: WHD-001
      confidence: HIGH

  # =========================================================================
  # WHD-002: Membership tests against fixed vocabularies
  # =========================================================================
  - id: whd-002-membership-test
    patterns:
      - pattern-inside: |
          def $FUNC(...):
            ...
            if $INPUT in $COLLECTION:
              ...
    pattern-either:
      - pattern: |
          if $INPUT in ["$STR1", "$STR2", ...]:
            ...
        metavariable-regex:
          metavariable: $INPUT
          regex: "(message|text|content|input|student_message|user_message|query|prompt|body|data|payload)"
      - pattern: |
          if $INPUT in {"$STR1", "$STR2", ...}:
            ...
        metavariable-regex:
          metavariable: $INPUT
          regex: "(message|text|content|input|student_message|user_message|query|prompt|body|data|payload)"
    message: |
      Membership test against fixed vocabulary detected.
      Consider whether this vocabulary should be dynamic or handled differently.
    severity: ERROR
    languages: [python]
    metadata:
      category: correctness
      technology: [python]
      subcategory: audit
      whd_rule: WHD-002
      confidence: HIGH

  # =========================================================================
  # WHD-003: If/elif chains with string comparisons
  # =========================================================================
  - id: whd-003-if-elif-chain
    patterns:
      - pattern-inside: |
          def $FUNC(...):
            ...
            if $COND1:
              ...
            elif $COND2:
              ...
            elif $COND3:
              ...
    pattern-either:
      - pattern: |
          if $INPUT == "$STR1":
            ...
          elif $INPUT == "$STR2":
            ...
          elif $INPUT == "$STR3":
            ...
        metavariable-regex:
          metavariable: $INPUT
          regex: "(message|text|content|input|student_message|user_message|query|prompt)"
    message: |
      Fixed decision tree (if/elif chain) detected with multiple string comparisons.
      This pattern may indicate hardcoded conversational routing.
    severity: WARNING
    languages: [python]
    metadata:
      category: correctness
      technology: [python]
      subcategory: audit
      whd_rule: WHD-003
      confidence: MEDIUM

  # =========================================================================
  # WHD-005: Dictionary lookups with string keys
  # =========================================================================
  - id: whd-005-dict-lookup
    patterns:
      - pattern-inside: |
          def $FUNC(...):
            ...
            $RESULT = $DICT["$KEY"]
            ...
    pattern-either:
      - pattern: |
          $RESULT = $MAPPING["$KEY"]
        metavariable-regex:
          metavariable: $MAPPING
          regex: "(mapping|response|action|template|reply|message_map|vocab|phrase_map|responses|replies)"
      - pattern: |
          $RESULT = $DICT[$KEY]
        metavariable-regex:
          metavariable: $DICT
          regex: "(mapping|response|action|template|reply|message_map|vocab|phrase_map|responses|replies)"
    message: |
      Dictionary lookup with string key in mapping-like variable.
      This may represent a word-to-action mapping.
    severity: WARNING
    languages: [python]
    metadata:
      category: correctness
      technology: [python]
      subcategory: audit
      whd_rule: WHD-005
      confidence: MEDIUM

  # =========================================================================
  # WHD-007: Functions returning literal responses
  # =========================================================================
  - id: whd-007-literal-response
    patterns:
      - pattern-inside: |
          def $RESPONSE_FUNC(...):
            ...
            return "$RESPONSE"
    metavariable-regex:
      metavariable: $RESPONSE_FUNC
      regex: "(response|reply|greeting|answer|message|output|say|speak)"
    message: |
      Function with response-indicating name returns a literal string.
      This may be a predetermined response bypassing contextual intelligence.
    severity: WARNING
    languages: [python]
    metadata:
      category: correctness
      technology: [python]
      subcategory: audit
      whd_rule: WHD-007
      confidence: MEDIUM

  # =========================================================================
  # WHD-008: Hardcoded vocabularies
  # =========================================================================
  - id: whd-008-vocabulary-assignment
    patterns:
      - pattern-inside: |
          $VOCAB = ["$WORD1", "$WORD2", ...]
    metavariable-regex:
      metavariable: $VOCAB
      regex: "(words|phrases|vocabulary|terms|keywords|topics|subjects|greetings|responses|replies|messages|inputs)"
    message: |
      Hardcoded vocabulary assignment detected.
      Review whether this collection is used for student classification or behavior routing.
    severity: WARNING
    languages: [python]
    metadata:
      category: correctness
      technology: [python]
      subcategory: audit
      whd_rule: WHD-008
      confidence: MEDIUM

  # =========================================================================
  # WHD-004: Regex pattern matching
  # =========================================================================
  - id: whd-004-regex-pattern
    patterns:
      - pattern-inside: |
          import re
          ...
          def $FUNC(...):
            ...
            $RESULT = re.$METHOD("$PATTERN", ...)
    pattern-either:
      - pattern: |
          re.search(r"\b$WORD\b", ...)
      - pattern: |
          re.match(r"\b$WORD\b", ...)
      - pattern: |
          re.search("$LONG_PATTERN", ...)
        metavariable-regex:
          metavariable: $LONG_PATTERN
          regex: ".{10,}"
      - pattern: |
          re.match("$LONG_PATTERN", ...)
        metavariable-regex:
          metavariable: $LONG_PATTERN
          regex: ".{10,}"
    message: |
      Regex pattern with word boundaries or long patterns detected.
      Review whether this pattern is necessary for conversational routing.
    severity: WARNING
    languages: [python]
    metadata:
      category: correctness
      technology: [python]
      subcategory: audit
      whd_rule: WHD-004
      confidence: MEDIUM
